name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run retrieval tests
        run: python test_retrieve.py
      - name: Run main-path tests
        run: python test_main_path.py
      - name: Run characterization tests
        run: python test_characterization.py
      - name: Run faq_stats tests
        run: python test_faq_stats.py
      - name: Run agent tests
        run: python test_agent.py
      - name: Run ticket_store tests
        run: python test_ticket_store.py
      - name: Run billing/SaaS tests
        run: python test_billing.py
      - name: Run wrap/retro tests
        run: python test_wrap.py
      - name: Run eval set
        run: python eval_run.py
      - name: Gate ready (all unit suites)
        run: python scripts/gate_ready.py
      - name: Demo three states (no secrets needed)
        run: python demo_main_path.py
      - name: Demo agent routing
        run: python demo_agent.py
      - name: Demo SaaS loop
        run: python demo_saas.py
      - name: Demo wrap talk
        run: python demo_wrap.py
      - name: FAQ stats smoke
        run: python faq_stats.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets
        run: |
          set -e
          # 拦常见泄露形态：赋值进仓库的智谱 key、sk- 长串、.env 内容文件
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "拒绝：仓库中不应跟踪 .env 文件"
            git ls-files | grep -E '(^|/)\.env($|\.)' || true
            exit 1
          fi
          # 只拦「看起来像真 key」的赋值；README 里 ZHIPU_API_KEY="你的key" 这类占位不报
          if grep -RInE --exclude-dir=.git --exclude-dir=.github \
            -e 'ZHIPU_API_KEY\s*=\s*["'\''][A-Za-z0-9_\.\-]{16,}["'\'']' \
            -e 'api[_-]?key\s*=\s*["'\''][A-Za-z0-9_\.\-]{16,}["'\'']' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            . ; then
            echo "拒绝：疑似密钥硬编码"
            exit 1
          fi
          echo "密钥扫描通过"
